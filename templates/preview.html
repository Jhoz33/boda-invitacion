{% load static %}
<!DOCTYPE html>
<html lang="es-PE">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista previa de la invitación</title>
  <link rel="stylesheet" href="{% static 'css/preview-invitacion.css' %}?v=1779541200">
</head>

<body>
  <div class="preview-fondo">
    <div class="preview-panel">

      <div class="preview-titulo">Vista previa</div>

      <div class="preview-marco">
        <div class="preview-telefono">
          <iframe id="preview-iframe" src="{% url 'invitacion:inicio' %}?libro=1" title="Vista previa de la invitación"
            allow="autoplay" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
        </div>
      </div>

      <div class="preview-pestanas" role="tablist">
        <button type="button" class="preview-pestana activa" data-modo="capa" role="tab">Portada</button>
        <button type="button" class="preview-pestana" data-modo="1" role="tab">Libro</button>
      </div>

      <button type="button" class="preview-boton" id="preview-reactivar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
        Reactivar libro
      </button>

    </div>
  </div>

  <script>
    (function () {
      var marco = document.getElementById('preview-iframe');
      var base = "{% url 'invitacion:inicio' %}";
      var pestanas = document.querySelectorAll('.preview-pestana');

      Array.prototype.forEach.call(pestanas, function (btn) {
        btn.addEventListener('click', function () {
          Array.prototype.forEach.call(pestanas, function (otro) {
            otro.classList.remove('activa');
          });
          btn.classList.add('activa');
          marco.src = base + '?libro=' + btn.getAttribute('data-modo');
        });
      });

      document.getElementById('preview-reactivar').addEventListener('click', function () {
        if (marco.contentWindow) {
          marco.contentWindow.postMessage({ type: 'abrir-libro' }, '*');
        }
      });
    })();
  </script>
</body>

</html>
